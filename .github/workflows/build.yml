name: Native build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - name: Full 7-Zip 26.05 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/7zip | Out-Null
          Invoke-WebRequest https://github.com/ip7z/7zip/releases/download/26.05/7z2605-x64.exe -OutFile vendor/7zip-setup.exe
          & 7z x vendor/7zip-setup.exe -ovendor/7zip -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & vendor/7zip/7z.exe i
      - name: Full 7-Zip 26.05 (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p vendor/7zip
          curl -fL https://github.com/ip7z/7zip/releases/download/26.05/7z2605-mac.tar.xz -o vendor/7zip.tar.xz
          tar -xf vendor/7zip.tar.xz -C vendor/7zip
          chmod +x vendor/7zip/7zz
          vendor/7zip/7zz i
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure