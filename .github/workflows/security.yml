name: Security dependency audit
on:
  push:
  pull_request:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rustsec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codec: [unalz, unegg, easycrab]
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file third_party/${{ matrix.codec }}/Cargo.lock
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-upstreams.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
